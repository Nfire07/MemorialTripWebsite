<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
  stroke="#444444"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- Base -->
  <line x1="8" y1="60" x2="56" y2="60" />

  <!-- Arco alla base -->
  <path d="M16 58 Q32 46 48 58" fill="none" />

  <!-- Pilastri principali -->
  <line x1="20" y1="58" x2="32" y2="10" />
  <line x1="44" y1="58" x2="32" y2="10" />

  <!-- Primo livello (grande piattaforma) -->
  <line x1="22" y1="42" x2="42" y2="42" />
  <!-- Supporti laterali -->
  <line x1="20" y1="58" x2="22" y2="42" />
  <line x1="44" y1="58" x2="42" y2="42" />

  <!-- Secondo livello -->
  <line x1="26" y1="30" x2="38" y2="30" />
  <line x1="22" y1="42" x2="26" y2="30" />
  <line x1="42" y1="42" x2="38" y2="30" />

  <!-- Terzo livello (piccolo piano) -->
  <line x1="29" y1="22" x2="35" y2="22" />
  <line x1="26" y1="30" x2="29" y2="22" />
  <line x1="38" y1="30" x2="35" y2="22" />

  <!-- Sommità (guglia e antenna) -->
  <line x1="32" y1="10" x2="32" y2="16" />
  <line x1="32" y1="16" x2="32" y2="4" />
  <circle cx="32" cy="2" r="1.2" fill="black" />

  <!-- Tralicci decorativi (effetto ferro) -->
  <line x1="16" y1="58" x2="42" y2="42" stroke-width="1" opacity="0.5" />
  <line x1="48" y1="58" x2="22" y2="42" stroke-width="1" opacity="0.5" />
  <line x1="22" y1="42" x2="38" y2="30" stroke-width="1" opacity="0.5" />
  <line x1="42" y1="42" x2="26" y2="30" stroke-width="1" opacity="0.5" />
  <line x1="26" y1="30" x2="35" y2="22" stroke-width="1" opacity="0.5" />
  <line x1="38" y1="30" x2="29" y2="22" stroke-width="1" opacity="0.5" />
</svg>
